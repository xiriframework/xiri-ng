<mat-form-field subscriptSizing="dynamic">
	@if (field().name) {
		<mat-label>{{ field().name }}</mat-label>
	}
	<mat-chip-grid #chipGrid [disabled]="disabled()">
		@for (chip of chips(); track chip) {
			<mat-chip-row (removed)="remove(chip)" [class]="chipColor(chip)" [removable]="!disabled()">
				{{ displayLabel(chip) }}
				<button matChipRemove [disabled]="disabled()" [attr.aria-label]="'Entfernen: ' + displayLabel( chip )">
					<mat-icon>cancel</mat-icon>
				</button>
			</mat-chip-row>
		}
	</mat-chip-grid>
	<input #chipInput
	       [matChipInputFor]="chipGrid"
	       [matChipInputSeparatorKeyCodes]="separatorKeyCodes()"
	       [matChipInputAddOnBlur]="true"
	       (matChipInputTokenEnd)="add($event)"
	       (input)="onInput()"
	       [xiriSuggest]="field()" #suggest="xiriSuggest"
	       [matAutocomplete]="auto"
	       [disabled]="disabled()"
	       [placeholder]="field().hint || ''">
	<!-- autoActiveFirstOption explizit aus: MAT_AUTOCOMPLETE_DEFAULT_OPTIONS der Host-App würde Enter sonst
	     immer auf die erste Option lenken. mousedown verhindern: sonst blurt der Klick das Input, und
	     matChipInputAddOnBlur legt den Teiltext als zweiten Chip an. -->
	<mat-autocomplete #auto="matAutocomplete" [autoActiveFirstOption]="false" (optionSelected)="selected($event)">
		@for (option of suggest.options(); track option.name) {
			<mat-option [value]="option" (mousedown)="$event.preventDefault()">{{ option.name }}</mat-option>
		}
	</mat-autocomplete>
</mat-form-field>
