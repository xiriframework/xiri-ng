<app-demo-page [bread]="breadcrumbs">
	<div class="xrow">
		<div class="xcol">
			<xiri-page-header [settings]="pageHeader"></xiri-page-header>
		</div>

		<div class="xcol xcol-lg-5">
			<div class="xrow">
				<div class="xcol">
					<xiri-section [settings]="sectionClaude">
						<textarea class="ask-input" rows="3" aria-label="Frage an Claude" placeholder="z. B. Zeig die Umsätze der letzten 4 Quartale"
						          [value]="question()" (input)="question.set($any($event.target).value)"
						          (keydown.control.enter)="question().trim() && !streaming() && ask()"></textarea>
						<div class="actions">
							<input class="token" type="password" aria-label="Schlüssel der Brücke" placeholder="Schlüssel"
							       autocomplete="off" [value]="token()" (input)="setToken($any($event.target).value)">
							<button mat-flat-button class="ask" [disabled]="streaming() || !question().trim()" (click)="ask()">Senden</button>
							@if (sessionId()) {
								<button mat-button class="reset" [disabled]="streaming()" (click)="newConversation()">Neues Gespräch</button>
							}
						</div>
						@if (askStatus()) {
							<p class="ask-status">{{ askStatus() }}</p>
						}
					</xiri-section>
				</div>

				<div class="xcol">
					<xiri-section [settings]="sectionProgram">
						<textarea class="program" spellcheck="false" aria-label="OpenUI-Lang-Programm"
						          [value]="program()" [readOnly]="streaming()"
						          (input)="edit($any($event.target).value)"></textarea>
						<div class="actions">
							<button mat-flat-button class="stream" [disabled]="streaming()" (click)="stream()">Streamen</button>
						</div>
						@if (errors().length) {
							<ul class="errors">
								@for (e of errors(); track $index) {
									<li><code>{{ e.code }}</code> {{ e.statementId }}: {{ e.message }}</li>
								}
							</ul>
						}
					</xiri-section>
				</div>
			</div>
		</div>

		<div class="xcol xcol-lg-7">
			<openui-renderer [library]="library" [response]="response()" [isStreaming]="streaming()"
			                 (error)="errors.set($event)"></openui-renderer>
		</div>

		<div class="xcol">
			<xiri-section [settings]="sectionPrompt">
				<pre class="prompt">{{ prompt }}</pre>
			</xiri-section>
		</div>
	</div>
</app-demo-page>
