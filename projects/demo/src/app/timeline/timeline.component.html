<app-demo-page [bread]="breadcrumbs">
	<div class="xrow">
		<!-- Seitenkopf -->
		<div class="xcol">
			<xiri-page-header [settings]="pageHeaderIntro"></xiri-page-header>
		</div>

		<!-- Activity Log -->
		<div class="xcol">
			<xiri-section [settings]="sectionActivityLog">
				<div class="xrow">
					<div class="xcol-md-6">
						<xiri-timeline [settings]="activityTimeline"></xiri-timeline>
					</div>
					<div class="xcol-md-6">
						<app-go-code [code]="goActivityCode" title="Go: timeline"></app-go-code>
					</div>
				</div>
			</xiri-section>
		</div>

		<!-- Order Status -->
		<div class="xcol">
			<xiri-section [settings]="sectionOrderStatus">
				<div class="xrow">
					<div class="xcol-md-6">
						<xiri-timeline [settings]="statusTimeline"></xiri-timeline>
					</div>
					<div class="xcol-md-6">
						<app-go-code [code]="goOrderCode" title="Go: timeline (compact)"></app-go-code>
					</div>
				</div>
			</xiri-section>
		</div>

		<!-- Simple Steps -->
		<div class="xcol">
			<xiri-section [settings]="sectionSimpleSteps">
				<div class="xrow">
					<div class="xcol-md-6">
						<xiri-timeline [settings]="simpleTimeline"></xiri-timeline>
					</div>
					<div class="xcol-md-6">
						<app-go-code [code]="goSimpleCode" title="Go: timeline (minimal)"></app-go-code>
					</div>
				</div>
			</xiri-section>
		</div>

		<!-- Horizontal Stepper -->
		<div class="xcol">
			<xiri-section [settings]="sectionHorizontalStepper">
				<div class="xrow">
					<div class="xcol">
						<xiri-timeline [settings]="horizontalStepperTimeline"></xiri-timeline>
					</div>
				</div>
				<div class="xrow">
					<div class="xcol">
						<app-go-code [code]="goHorizontalCode" title="Go: timeline.WithOrientation(...)"></app-go-code>
					</div>
				</div>
			</xiri-section>
		</div>
	</div>
</app-demo-page>
