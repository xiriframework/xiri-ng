<app-demo-page [bread]="breadcrumbs">
	<div class="xrow">
		<!-- Seitenkopf -->
		<div class="xcol">
			<xiri-page-header [settings]="pageHeaderIntro"></xiri-page-header>
		</div>

		<!-- Field Types -->
		<div class="xcol">
			<xiri-section [settings]="sectionFieldTypes">
				<mat-card class="mat-elevation-z2">
					<mat-card-content>
						<xiri-form [settings]="data"></xiri-form>
					</mat-card-content>
				</mat-card>
				<app-go-code [code]="goFieldTypesCode" title="Go: form/field"></app-go-code>
			</xiri-section>
		</div>

		<!-- Collapsible Sections & Dividers -->
		<div class="xcol">
			<xiri-section [settings]="sectionSections">
				<mat-card class="mat-elevation-z2">
					<mat-card-content>
						<xiri-form [settings]="sectionsData"></xiri-form>
					</mat-card-content>
				</mat-card>
				<app-go-code [code]="goSectionsCode" title="Go: form (sections)"></app-go-code>
			</xiri-section>
		</div>

		<!-- Conditional Fields -->
		<div class="xcol">
			<xiri-section [settings]="sectionConditional">
				<mat-card class="mat-elevation-z2">
					<mat-card-content>
						<xiri-form [settings]="conditionalData"></xiri-form>
					</mat-card-content>
				</mat-card>
				<app-go-code [code]="goConditionalCode" title="Go: field.SetShowWhen"></app-go-code>
			</xiri-section>
		</div>

		<!-- Dependent Fields -->
		<div class="xcol">
			<xiri-section [settings]="sectionReload">
				<mat-card class="mat-elevation-z2">
					<mat-card-content>
						<xiri-form [settings]="reloadData"></xiri-form>
					</mat-card-content>
				</mat-card>
				<app-go-code [code]="goReloadCode" title="Go: field.SetReloadOn"></app-go-code>
			</xiri-section>
		</div>

		<!-- Repeatable Rows -->
		<div class="xcol">
			<xiri-section [settings]="sectionRows">
				<mat-card class="mat-elevation-z2">
					<mat-card-content>
						<xiri-form [settings]="rowsData"></xiri-form>
					</mat-card-content>
				</mat-card>
				<app-go-code [code]="goRowsCode" title="Go: field.NewRowsField"></app-go-code>
			</xiri-section>
		</div>
	</div>
</app-demo-page>
