<app-demo-page [bread]="breadcrumbs">
	<div class="xrow">
		<!-- Seitenkopf -->
		<div class="xcol">
			<xiri-page-header [settings]="pageHeaderIntro"></xiri-page-header>
		</div>

		<!-- File Upload -->
		<div class="xcol">
			<xiri-section [settings]="sectionFileUpload">
				<mat-card class="mat-elevation-z2">
					<mat-card-content>
						<xiri-form [settings]="fileForm"></xiri-form>
					</mat-card-content>
				</mat-card>
				<app-go-code [code]="goFileCode" title="Go: field (file)"></app-go-code>
			</xiri-section>
		</div>

		<!-- Volume -->
		<div class="xcol">
			<xiri-section [settings]="sectionVolume">
				<mat-card class="mat-elevation-z2">
					<mat-card-content>
						<xiri-form [settings]="volumeForm"></xiri-form>
					</mat-card-content>
				</mat-card>
				<app-go-code [code]="goVolumeCode" title="Go: field (volume)"></app-go-code>
			</xiri-section>
		</div>

		<!-- Timelimit -->
		<div class="xcol">
			<xiri-section [settings]="sectionTimelimit">
				<mat-card class="mat-elevation-z2">
					<mat-card-content>
						<xiri-form [settings]="timelimitForm"></xiri-form>
					</mat-card-content>
				</mat-card>
				<app-go-code [code]="goTimelimitCode" title="Go: field (timelimit)"></app-go-code>
			</xiri-section>
		</div>

		<!-- Question -->
		<div class="xcol">
			<xiri-section [settings]="sectionQuestion">
				<mat-card class="mat-elevation-z2">
					<mat-card-content>
						<xiri-form [settings]="questionForm"></xiri-form>
					</mat-card-content>
				</mat-card>
				<app-go-code [code]="goQuestionCode" title="Go: field (question)"></app-go-code>
			</xiri-section>
		</div>

		<!-- Waiting -->
		<div class="xcol">
			<xiri-section [settings]="sectionWaiting">
				<mat-card class="mat-elevation-z2">
					<mat-card-content>
						<xiri-form [settings]="waitingForm"></xiri-form>
					</mat-card-content>
				</mat-card>
				<app-go-code [code]="goWaitingCode" title="Go: field (waiting)"></app-go-code>
			</xiri-section>
		</div>

		<!-- Chips / Tags -->
		<div class="xcol">
			<xiri-section [settings]="sectionChips">
				<mat-card class="mat-elevation-z2">
					<mat-card-content>
						<xiri-form [settings]="chipsForm"></xiri-form>
					</mat-card-content>
				</mat-card>
				<app-go-code [code]="goChipsCode" title="Go: field (chips)"></app-go-code>
			</xiri-section>
		</div>

		<!-- Radio -->
		<div class="xcol">
			<xiri-section [settings]="sectionRadio">
				<mat-card class="mat-elevation-z2">
					<mat-card-content>
						<xiri-form [settings]="radioForm"></xiri-form>
					</mat-card-content>
				</mat-card>
				<app-go-code [code]="goRadioCode" title="Go: field.NewRadioField"></app-go-code>
			</xiri-section>
		</div>
	</div>
</app-demo-page>
