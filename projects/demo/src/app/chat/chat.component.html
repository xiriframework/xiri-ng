<app-demo-page [bread]="breadcrumbs">
	<div class="xrow">
		<!-- Seitenkopf -->
		<div class="xcol">
			<xiri-page-header [settings]="pageHeader"></xiri-page-header>
		</div>

		<div class="xcol">
			<xiri-section [settings]="section">
				<div class="xrow">
					<div class="xcol-md-6">
						<xiri-chat [settings]="chat"></xiri-chat>
					</div>
					<div class="xcol-md-6">
						<app-go-code [code]="goCode" title="Go: chat"></app-go-code>
					</div>
				</div>
			</xiri-section>
		</div>
	</div>
</app-demo-page>
